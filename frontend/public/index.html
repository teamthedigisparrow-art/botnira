    {
      "@context": "https://schema.org",

        {
          "@type": "Question",
          "name": "What is BotNira?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BotNira is an AI receptionist and AI-based calling software that answers your business phone calls, WhatsApp messages, SMS, email and website chat 24/7. It is trained on your own business information so every reply matches your services, hours, and pricing."
          }
        },
        {
          "@type": "Question",
          "name": "How does AI calling work in BotNira?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BotNira gives you a phone number powered by AI voice. When a customer calls, BotNira answers in a natural voice, understands the question, and replies based on your business knowledge. It can also book appointments and send confirmations by SMS and email."
          }
        },
        {
          "@type": "Question",
          "name": "Is BotNira a real AI receptionist replacement?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. BotNira works like a 24/7 virtual receptionist for all kind and all scale businesses — never misses a call, replies instantly across every channel, and books appointments straight into your calendar. You can take over any conversation as a live agent at any time."
          }
        },
        {
          "@type": "Question",
          "name": "Which channels does the AI receptionist handle?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Voice phone calls, WhatsApp Business, SMS (US/CA), email (any IMAP/SMTP inbox like Gmail, Outlook, Zoho), and a website chat widget — all in one shared inbox."
          }
        },
        {
          "@type": "Question",
          "name": "Will the AI invent answers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. BotNira is grounded strictly in the business description and FAQs you provide. If asked something outside your scope, the AI politely says it will have someone follow up — instead of making things up."
          }
        }
      ]
    }
    </script>
